[workspace]
resolver = "2"
members = ["crates/inference-core", "crates/imajev-runtime", "canisters/inference", "crates/imajev-client"]
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
candid = "0.10"
ic-cdk = "=0.20.3"
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true
