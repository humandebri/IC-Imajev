[package]
name = "imajev-inference"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
imajev-runtime = { path = "../../crates/imajev-runtime" }
ic-cdk.workspace = true
candid.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
serde_bytes = { version = "=0.11.19", optional = true }

[features]
default = ["experimental-adaptive-token-tiles"]
experimental-adaptive-token-tiles = ["experimental-update-token-chunks", "imajev-runtime/experimental-adaptive-token-tiles"]
experimental-update-token-chunks = ["paid-update-inference", "imajev-runtime/experimental-update-token-chunks"]
paid-update-inference = ["experimental-update-inference", "experimental-full-weight-cache"]
paid-update-diagnostics = ["paid-update-inference"]
experimental-update-inference = ["experimental-prefix-hybrid", "experimental-mlp-full89", "experimental-attention-full", "experimental-mlp-delta-query"]
experimental-mlp-delta-query = ["experimental-mlp-stream", "experimental-delta-full-log"]
experimental-single-quad = ["experimental-strassen-raw", "imajev-runtime/experimental-single-quad"]
experimental-terminal-stream = ["experimental-mlp-attention-finish", "experimental-terminal-attention", "imajev-runtime/experimental-terminal-stream"]
experimental-attention-views = ["imajev-runtime/experimental-attention-views"]
experimental-mlp-attention-finish = ["experimental-mlp-stream", "imajev-runtime/experimental-mlp-attention-finish"]
experimental-prefix-update-hoist = ["imajev-runtime/experimental-prefix-update-hoist"]
experimental-attention-mlp-stream = ["experimental-mlp-stream", "experimental-attention-full", "imajev-runtime/experimental-attention-mlp-stream"]
experimental-mlp-delta-stream = ["experimental-mlp-stream", "experimental-int8-k-continue", "experimental-delta-state-layout", "experimental-mlp-full89", "imajev-runtime/experimental-mlp-delta-stream"]
experimental-int8-k-continue = ["experimental-strassen-raw", "experimental-projection-reuse", "imajev-runtime/experimental-int8-k-continue"]
experimental-direct-mlp-reply = ["experimental-mlp-stream", "imajev-runtime/experimental-direct-mlp-reply"]
experimental-mlp-half = ["experimental-mlp-stream", "imajev-runtime/experimental-mlp-half"]
experimental-mlp-stream = ["experimental-mlp-pipeline", "experimental-f32-k-continue", "imajev-runtime/experimental-mlp-stream"]
experimental-f32-k-continue = ["experimental-f32-output-generic", "imajev-runtime/experimental-f32-k-continue"]
experimental-host-checksum = ["experimental-projection-reuse", "imajev-runtime/experimental-host-checksum"]
experimental-terminal-tail = ["experimental-terminal-attention", "experimental-mlp-full89", "imajev-runtime/experimental-terminal-tail"]
experimental-f32-output-generic = ["experimental-f32-output-reuse","imajev-runtime/experimental-f32-output-generic"]
experimental-f32-output-reuse = ["imajev-runtime/experimental-f32-output-reuse"]
experimental-mlp-delta-fusion = ["imajev-runtime/experimental-mlp-delta-fusion"]
experimental-delta-state-layout = ["imajev-runtime/experimental-delta-state-layout"]
experimental-delta-no-writeback = ["imajev-runtime/experimental-delta-no-writeback"]
experimental-prefix-start = ["experimental-prefix-hybrid", "imajev-runtime/experimental-prefix-start"]
experimental-terminal-attention = ["experimental-attention-full", "imajev-runtime/experimental-terminal-attention"]
experimental-strassen-raw = ["experimental-pair-wat", "imajev-runtime/experimental-strassen-raw"]
experimental-strassen-output128 = ["experimental-strassen-raw", "imajev-runtime/experimental-strassen-output128"]
experimental-pair-direct-input = ["experimental-pair-wat", "imajev-runtime/experimental-pair-direct-input"]
experimental-paired-only = ["experimental-prepared-output-pairs", "imajev-runtime/experimental-paired-only"]
experimental-pair-wat = ["experimental-prepared-output-pairs", "imajev-runtime/experimental-pair-wat"]
experimental-pair-shared-body = ["experimental-prepared-output-pairs", "imajev-runtime/experimental-pair-shared-body"]
experimental-prefix-hybrid = ["experimental-delta-full-log", "experimental-projection-reuse", "imajev-runtime/experimental-prefix-hybrid"]
experimental-lora-input-sharing = ["imajev-runtime/experimental-lora-input-sharing"]
experimental-mlp-full89 = ["experimental-mlp-full", "imajev-runtime/experimental-mlp-full89"]
experimental-prepared-output-pairs = ["imajev-runtime/experimental-prepared-output-pairs"]
experimental-prepared-activation = ["imajev-runtime/experimental-prepared-activation"]
experimental-delta-full-log = ["experimental-byte-buffer", "experimental-delta-projected", "imajev-runtime/experimental-delta-full-log"]
experimental-column32 = ["imajev-runtime/experimental-adopt-column32"]
experimental-byte-buffer = ["dep:serde_bytes"]
experimental-balanced44 = ["imajev-runtime/experimental-adopt-balanced44"]
experimental-mlp-full = ["experimental-byte-buffer", "experimental-mlp-pipeline", "imajev-runtime/experimental-mlp-full"]
experimental-attention-full = ["imajev-runtime/experimental-attention-full"]
experimental-dot-scale = ["imajev-runtime/experimental-adopt-dot-scale"]
experimental-mlp-pipeline = ["experimental-projection-reuse", "imajev-runtime/experimental-mlp-pipeline"]
experimental-delta-finish = ["imajev-runtime/experimental-delta-finish"]
experimental-matrix-tail = ["imajev-runtime/experimental-adopt-matrix-tail"]
experimental-column16-token48 = ["imajev-runtime/experimental-adopt-column16-token48"]
experimental-column16 = ["imajev-runtime/experimental-adopt-column16"]
experimental-prepared-rope = ["imajev-runtime/experimental-prepared-rope"]
experimental-delta-projected = ["imajev-runtime/experimental-delta-projected"]
experimental-attention-fusion = ["imajev-runtime/experimental-attention-fusion"]
experimental-blake3 = ["imajev-runtime/experimental-blake3"]
instruction-profile = ["imajev-runtime/instruction-profile"]
experimental-wide-token-tiles = ["imajev-runtime/experimental-wide-token-tiles"]
experimental-full-weight-cache = []
experimental-strassen-prepared = ["imajev-runtime/experimental-strassen-prepared"]
experimental-strassen-packed-reduction = ["experimental-strassen-prepared", "imajev-runtime/experimental-strassen-packed-reduction"]
experimental-projection-reuse = ["imajev-runtime/experimental-projection-reuse"]
