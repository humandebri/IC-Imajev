[package]
name="imajev-prefix-codec-bench"
version="0.1.0"
edition="2021"
[workspace]
[lib]
crate-type=["cdylib","rlib"]
[dependencies]
imajev-runtime={path="../../crates/imajev-runtime",features=["experimental-blake3","experimental-projection-reuse","experimental-attention-fusion","experimental-attention-full","experimental-delta-projected","experimental-prepared-rope","experimental-column16-token48","experimental-delta-finish","experimental-matrix-tail","experimental-mlp-pipeline","experimental-mlp-full","experimental-dot-scale","experimental-balanced44","experimental-column32","experimental-delta-full-log","experimental-prepared-activation","experimental-prepared-output-pairs"]}
ic-cdk="=0.20.3"
candid="=0.10.35"
serde={version="1",features=["derive"]}
serde_json="1"
sha2="=0.10.9"
[profile.release]
opt-level=3
lto="thin"
codegen-units=1
panic="abort"
overflow-checks=true
