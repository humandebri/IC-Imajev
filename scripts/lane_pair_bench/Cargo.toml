[package]
name="imajev-lane-pair-bench"
version="0.1.0"
edition="2021"
[workspace]
[lib]
crate-type=["cdylib","rlib"]
[dependencies]
imajev-runtime={path="../../crates/imajev-runtime",features=[]}
ic-cdk="=0.20.3"
candid="=0.10.35"
serde={version="1",features=["derive"]}
serde_json="1"
sha2="=0.10.9"
[profile.release]
opt-level=3
lto="thin"
codegen-units=1
panic="abort"
overflow-checks=true
