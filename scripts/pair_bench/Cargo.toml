[package]
name="imajev-pair-bench"
version="0.1.0"
edition="2021"
[workspace]
[lib]
crate-type=["cdylib","rlib"]
[features]
column32 = ["balanced44", "imajev-runtime/experimental-column32"]
balanced44 = ["dot-scale", "imajev-runtime/experimental-balanced44"]
dot-scale = ["column16-token48", "imajev-runtime/experimental-dot-scale"]
matrix-tail=["imajev-runtime/experimental-matrix-tail"]
column16=["imajev-runtime/experimental-column16"]
column16-token48=["column16-explicit","imajev-runtime/experimental-column16-token48"]
column16-explicit=["column16","imajev-runtime/experimental-explicit-weight-loads"]
[dependencies]
imajev-runtime={path="../../crates/imajev-runtime"}
ic-cdk="=0.20.3"
candid="=0.10.35"
serde={version="1",features=["derive"]}
serde_json="1"
sha2="=0.10.9"
[profile.release]
opt-level=3
lto="thin"
codegen-units=1
panic="abort"
overflow-checks=true
