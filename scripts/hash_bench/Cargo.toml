[package]
name="imajev-hash-bench"
version="0.1.0"
edition="2021"
[workspace]
[lib]
crate-type=["cdylib","rlib"]
[features]
simd=["blake3/wasm32_simd"]
[dependencies]
ic-cdk="=0.20.3"
candid="=0.10.35"
serde={version="1",features=["derive"]}
serde_json="1"
sha2="=0.10.9"
blake3="=1.8.2"
[profile.release]
opt-level=3
lto="thin"
codegen-units=1
panic="abort"
overflow-checks=true
